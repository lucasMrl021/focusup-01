spring.application.name=focusup-api
server.port=8080

# Banco MySQL (veja docker-compose.yml na raiz do projeto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/focusup?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:focusup}
spring.datasource.password=${DB_PASSWORD:focusup}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Segurança: troque o segredo em produção (mínimo de 32 caracteres)
focusup.jwt.segredo=${JWT_SECRET:troque-este-segredo-por-um-valor-longo-e-aleatorio-2026}
focusup.jwt.validade-horas=168

# Fuso usado para "hoje", sequências e metas
focusup.fuso=America/Sao_Paulo

# Exige que a sessão dure o tempo escolhido antes de ser concluída
focusup.sessao.validar-tempo=true
focusup.sessao.tolerancia-segundos=10
